    <g>
      <rect x="850" y="570" width="508" height="50" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <text class="text" x="1104" y="602" text-anchor="middle" font-size="18">outᵢ = concat(X₀, X₁, X₂, X₃)，∀ i</text>
