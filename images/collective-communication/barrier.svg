<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
    <title id="title">Barrier（栅障）集合通信示意图</title>
    <desc id="desc">左侧显示各 Rank 在不同时间到达栅障并等待，右侧显示最后一个 Rank 到达后所有 Rank 才可以继续执行。</desc>
    
    <defs>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
        <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563eb"/>
      </marker>
      <marker id="lane-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
      </marker>
      <style>
        .text { font-family: Inter, 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; }
        .muted { fill: #64748b; }
        .panel-title { font-size: 24px; font-weight: 700; }
        .rank-label { font-size: 20px; font-weight: 650; }
        .small { font-size: 16px; }
        .data-label { font-size: 24px; font-weight: 750; fill: #1e3a8a; }
      </style>
    </defs>
    <rect width="1440" height="760" fill="#f8fafc"/>
    
    <text class="text" x="50" y="58" font-size="32" font-weight="750">Barrier（栅障）</text>
    <text class="text muted" x="50" y="94" font-size="18">所有 Rank 均进入同一栅障后，任意 Rank 才允许从该操作返回</text>
    <g transform="translate(1165 45)">
      <rect width="225" height="44" rx="22" fill="#eff6ff" stroke="#bfdbfe"/>
      <circle cx="24" cy="22" r="7" fill="#2563eb"/>
      <text class="text" x="42" y="28" font-size="16" font-weight="650">逻辑语义示意图</text>
    </g>
    
      
    <g filter="url(#shadow)">
      <rect x="50" y="130" width="570" height="520" rx="22" fill="#ffffff" stroke="#dbe3ee"/>
    </g>
    <text class="text panel-title" x="80" y="176">到达与等待</text>
    <text class="text muted small" x="218" y="175">先到达的 Rank 必须等待</text>
      
    <g filter="url(#shadow)">
      <rect x="820" y="130" width="570" height="520" rx="22" fill="#ffffff" stroke="#dbe3ee"/>
    </g>
    <text class="text panel-title" x="850" y="176">释放栅障</text>
    <text class="text muted small" x="964" y="175">全部到达后才允许继续</text>
      
    <g>
      <text class="text" x="720" y="318" text-anchor="middle" font-size="22" font-weight="750">Barrier</text>
      <text class="text muted" x="720" y="344" text-anchor="middle" font-size="14">最后一个 Rank 到达</text>
      <line x1="654" y1="380" x2="786" y2="380" stroke="#2563eb" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    </g>
      <line x1="590" y1="220" x2="590" y2="535" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
      <rect x="544" y="190" width="92" height="30" rx="15" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="590" y="211" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">BARRIER</text>
      
    <text class="text rank-label" x="118" y="273">Rank 0</text>
    <line x1="220" y1="266" x2="370" y2="266" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
    <circle cx="370" cy="266" r="9" fill="#60a5fa"/>
    <line x1="382" y1="266" x2="580" y2="266" stroke="#94a3b8" stroke-width="5" stroke-dasharray="9 8"/>
    <text class="text muted" x="370" y="248" text-anchor="middle" font-size="14">到达</text>
    <text class="text rank-label" x="118" y="351">Rank 1</text>
    <line x1="220" y1="344" x2="470" y2="344" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
    <circle cx="470" cy="344" r="9" fill="#34d399"/>
    <line x1="482" y1="344" x2="580" y2="344" stroke="#94a3b8" stroke-width="5" stroke-dasharray="9 8"/>
    <text class="text muted" x="470" y="326" text-anchor="middle" font-size="14">到达</text>
    <text class="text rank-label" x="118" y="429">Rank 2</text>
    <line x1="220" y1="422" x2="410" y2="422" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="410" cy="422" r="9" fill="#f59e0b"/>
    <line x1="422" y1="422" x2="580" y2="422" stroke="#94a3b8" stroke-width="5" stroke-dasharray="9 8"/>
    <text class="text muted" x="410" y="404" text-anchor="middle" font-size="14">到达</text>
    <text class="text rank-label" x="118" y="507">Rank 3</text>
    <line x1="220" y1="500" x2="535" y2="500" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="535" cy="500" r="9" fill="#38bdf8"/>
    <line x1="547" y1="500" x2="580" y2="500" stroke="#94a3b8" stroke-width="5" stroke-dasharray="9 8"/>
    <text class="text muted" x="535" y="482" text-anchor="middle" font-size="14">到达</text>
      <line x1="1028" y1="220" x2="1028" y2="535" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
      
    <text class="text rank-label" x="888" y="273">Rank 0</text>
    <circle cx="1028" cy="266" r="9" fill="#60a5fa"/>
    <line x1="1038" y1="266" x2="1318" y2="266" stroke="#2563eb" stroke-width="6" stroke-linecap="round" marker-end="url(#lane-arrow)"/>
    <text class="text muted" x="1170" y="248" text-anchor="middle" font-size="14">继续执行</text>
    <text class="text rank-label" x="888" y="351">Rank 1</text>
    <circle cx="1028" cy="344" r="9" fill="#34d399"/>
    <line x1="1038" y1="344" x2="1318" y2="344" stroke="#2563eb" stroke-width="6" stroke-linecap="round" marker-end="url(#lane-arrow)"/>
    <text class="text muted" x="1170" y="326" text-anchor="middle" font-size="14">继续执行</text>
    <text class="text rank-label" x="888" y="429">Rank 2</text>
    <circle cx="1028" cy="422" r="9" fill="#f59e0b"/>
    <line x1="1038" y1="422" x2="1318" y2="422" stroke="#2563eb" stroke-width="6" stroke-linecap="round" marker-end="url(#lane-arrow)"/>
    <text class="text muted" x="1170" y="404" text-anchor="middle" font-size="14">继续执行</text>
    <text class="text rank-label" x="888" y="507">Rank 3</text>
    <circle cx="1028" cy="500" r="9" fill="#38bdf8"/>
    <line x1="1038" y1="500" x2="1318" y2="500" stroke="#2563eb" stroke-width="6" stroke-linecap="round" marker-end="url(#lane-arrow)"/>
    <text class="text muted" x="1170" y="482" text-anchor="middle" font-size="14">继续执行</text>
      
    <g>
      <circle cx="97" cy="592" r="6" fill="#2563eb"/>
      <text class="text muted small" x="112" y="598">虚线表示已经到达但仍在等待</text>
    </g>
      
    <g>
      <rect x="850" y="570" width="508" height="50" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <text class="text" x="1104" y="602" text-anchor="middle" font-size="18">任意 Rank 离开 Barrier ⇒ 所有 Rank 均已进入 Barrier</text>
    </g>
    <text class="text muted" x="720" y="706" text-anchor="middle" font-size="15">Barrier 不传输用户数据，也不保证各 Rank 在完全相同的时刻返回；它只规定离开操作前的全员到达条件</text>
  </svg>
