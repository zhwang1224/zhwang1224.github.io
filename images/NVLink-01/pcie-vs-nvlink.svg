<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">PCIe 与 NVLink 的 GPU 互连路径</title>
  <desc id="desc">左侧：两张 GPU 经 PCIe 交换机和 Root Complex 通信，并与网卡共享链路。右侧：两张 GPU 通过多条 NVLink 直连，PCIe 仍用于连接 CPU 和网卡。</desc>
  
    <defs>
      <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
        <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
      </marker>
      <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
      </marker>
      <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
      </marker>
      <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
      </marker>
      <style>
        .text{font-family:Inter, 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;fill:#0f172a}
        .muted{fill:#64748b}
        .center{text-anchor:middle}
        .end{text-anchor:end}
      </style>
    </defs>
  <rect width="1600" height="780" fill="#f8fafc"/>
  
  <text class="text" x="58" y="58" font-size="34" font-weight="800">PCIe 与 NVLink 上的 GPU–GPU 路径</text>
  <text class="text muted" x="58" y="96" font-size="18">左：经 Root Complex / Switch 的共享树；右：NVLink 直连，PCIe 仍连接主机与 NIC</text>

  <g filter="url(#shadow)"><rect x="48" y="128" width="730" height="560" rx="26" fill="#ffffff" stroke="#cbd5e1"/></g>
  <g filter="url(#shadow)"><rect x="822" y="128" width="730" height="560" rx="26" fill="#ffffff" stroke="#cbd5e1"/></g>

  <text class="text center" x="413" y="172" font-size="22" font-weight="800">经 PCIe</text>
  <text class="text center muted" x="413" y="202" font-size="15">通用 I/O 总线 · 树形拓扑 · 与 NIC/SSD 共享</text>

  <rect x="248" y="230" width="330" height="64" rx="16" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="text center" x="413" y="270" font-size="18" font-weight="750">CPU / PCIe Root Complex</text>

  <path d="M413 294 V330" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-slate)"/>

  <rect x="248" y="336" width="330" height="58" rx="14" fill="#fee2e2" stroke="#fca5a5"/>
  <text class="text center" x="413" y="372" font-size="17" font-weight="750">PCIe Switch</text>

  <path d="M203 394 V430" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrow-red)"/>
  <path d="M413 394 V430" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrow-red)"/>
  <path d="M623 394 V430" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrow-red)"/>

  <rect x="108" y="436" width="190" height="88" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="text center" x="203" y="474" font-size="20" font-weight="800">GPU 0</text>
  <text class="text center muted" x="203" y="502" font-size="14">Endpoint</text>

  <rect x="318" y="436" width="190" height="88" rx="16" fill="#ffedd5" stroke="#fdba74"/>
  <text class="text center" x="413" y="474" font-size="20" font-weight="800">NIC</text>
  <text class="text center muted" x="413" y="502" font-size="14">共享 PCIe 树</text>

  <rect x="528" y="436" width="190" height="88" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="text center" x="623" y="474" font-size="20" font-weight="800">GPU 1</text>
  <text class="text center muted" x="623" y="502" font-size="14">Endpoint</text>

  <rect x="168" y="552" width="490" height="100" rx="18" fill="#fef2f2" stroke="#fecaca"/>
  <text class="text center" x="413" y="590" font-size="17" font-weight="750">GPU0 ──── PCIe ──── GPU1</text>
  <text class="text center muted" x="413" y="622" font-size="14">共享树；P2P 可能经 Switch 或折回 Root Complex</text>

  <text class="text center" x="1187" y="172" font-size="22" font-weight="800">经 NVLink</text>
  <text class="text center muted" x="1187" y="202" font-size="15">GPU 专用互连 · 多链路聚合 · 内存语义</text>

  <rect x="872" y="250" width="250" height="120" rx="18" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="text center" x="997" y="300" font-size="22" font-weight="800">GPU 0</text>
  <text class="text center muted" x="997" y="334" font-size="15">HBM + NVLink 端口</text>

  <rect x="1252" y="250" width="250" height="120" rx="18" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="text center" x="1377" y="300" font-size="22" font-weight="800">GPU 1</text>
  <text class="text center muted" x="1377" y="334" font-size="15">HBM + NVLink 端口</text>

  <line x1="1122" y1="292" x2="1252" y2="292" stroke="#059669" stroke-width="14" stroke-linecap="round"/>
  <line x1="1122" y1="312" x2="1252" y2="312" stroke="#34d399" stroke-width="10" stroke-linecap="round"/>
  <line x1="1122" y1="328" x2="1252" y2="328" stroke="#6ee7b7" stroke-width="7" stroke-linecap="round"/>
  <text class="text center" x="1187" y="236" font-size="15" font-weight="750" fill="#047857">NVLink × N</text>

  <path d="M997 370 V414" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M1377 370 V414" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-slate)"/>

  <rect x="892" y="420" width="210" height="70" rx="14" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="text center" x="997" y="462" font-size="16" font-weight="700">CPU / Host</text>
  <rect x="1272" y="420" width="210" height="70" rx="14" fill="#ffedd5" stroke="#fdba74"/>
  <text class="text center" x="1377" y="462" font-size="16" font-weight="700">NIC / Scale-out</text>

  <rect x="902" y="552" width="570" height="100" rx="18" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text class="text center" x="1187" y="590" font-size="17" font-weight="750">GPU0 ════ NVLink ════ GPU1</text>
  <text class="text center muted" x="1187" y="622" font-size="14">GPU–GPU 走 NVLink；PCIe 保留给主机与 NIC</text>
  
</svg>
