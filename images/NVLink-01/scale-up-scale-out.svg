<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Scale-up 域与 Scale-out 网络</title><desc id="desc">两个 NVLink 域各自包含 GPU 与交换网络，经网卡连接外部 InfiniBand 或以太网。互连域不等于单机边界。</desc>
<style>text{font-family:'Microsoft YaHei','Noto Sans SC','Segoe UI',sans-serif}</style>
<rect x="0" y="0" width="1200" height="860" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="52" font-size="32" fill="#16324f" text-anchor="start">NVLink 在 GPU 集群中的位置</text><text x="40" y="91" font-size="23" fill="#64748b" text-anchor="start">按互连域划分：一个 Scale-up 域不一定等于一台服务器</text><rect x="50" y="132" width="1100" height="90" rx="14" fill="#ede9fe" stroke="#cbd5e1"/><text x="600" y="185" font-size="23" fill="#16324f" text-anchor="middle">Scale-out 网络：InfiniBand / Ethernet（RoCE）</text><line x1="300" y1="222" x2="300" y2="270" stroke="#7c3aed" stroke-width="5"/><rect x="180" y="270" width="240" height="64" rx="14" fill="#ffedd5" stroke="#cbd5e1"/><text x="300" y="310" font-size="23" fill="#16324f" text-anchor="middle">NIC（示意）</text><line x1="300" y1="334" x2="300" y2="418" stroke="#d97706" stroke-width="5"/><text x="315" y="365" font-size="19" fill="#92400e" text-anchor="start">PCIe 等设备路径</text><rect x="50" y="389" width="500" height="345" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="300" y="431" font-size="26" fill="#047857" text-anchor="middle">Scale-up 域 A</text><line x1="170" y1="512" x2="300" y2="568" stroke="#059669" stroke-width="5"/><line x1="430" y1="512" x2="300" y2="568" stroke="#059669" stroke-width="5"/><line x1="170" y1="652" x2="300" y2="605" stroke="#059669" stroke-width="5"/><line x1="430" y1="652" x2="300" y2="605" stroke="#059669" stroke-width="5"/><rect x="90" y="467" width="160" height="60" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="170" y="505" font-size="23" fill="#16324f" text-anchor="middle">GPU 0</text><rect x="350" y="467" width="160" height="60" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="430" y="505" font-size="23" fill="#16324f" text-anchor="middle">GPU 1</text><rect x="90" y="642" width="160" height="60" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="170" y="680" font-size="23" fill="#16324f" text-anchor="middle">GPU 2</text><rect x="350" y="642" width="160" height="60" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="430" y="680" font-size="23" fill="#16324f" text-anchor="middle">GPU …</text><rect x="150" y="553" width="300" height="64" rx="14" fill="#dcfce7" stroke="#cbd5e1"/><text x="300" y="593" font-size="23" fill="#16324f" text-anchor="middle">NVLink / NVSwitch</text><line x1="900" y1="222" x2="900" y2="270" stroke="#7c3aed" stroke-width="5"/><rect x="780" y="270" width="240" height="64" rx="14" fill="#ffedd5" stroke="#cbd5e1"/><text x="900" y="310" font-size="23" fill="#16324f" text-anchor="middle">NIC（示意）</text><line x1="900" y1="334" x2="900" y2="418" stroke="#d97706" stroke-width="5"/><text x="915" y="365" font-size="19" fill="#92400e" text-anchor="start">PCIe 等设备路径</text><rect x="650" y="389" width="500" height="345" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="900" y="431" font-size="26" fill="#047857" text-anchor="middle">Scale-up 域 B</text><line x1="770" y1="512" x2="900" y2="568" stroke="#059669" stroke-width="5"/><line x1="1030" y1="512" x2="900" y2="568" stroke="#059669" stroke-width="5"/><line x1="770" y1="652" x2="900" y2="605" stroke="#059669" stroke-width="5"/><line x1="1030" y1="652" x2="900" y2="605" stroke="#059669" stroke-width="5"/><rect x="690" y="467" width="160" height="60" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="770" y="505" font-size="23" fill="#16324f" text-anchor="middle">GPU 0</text><rect x="950" y="467" width="160" height="60" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="1030" y="505" font-size="23" fill="#16324f" text-anchor="middle">GPU 1</text><rect x="690" y="642" width="160" height="60" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="770" y="680" font-size="23" fill="#16324f" text-anchor="middle">GPU 2</text><rect x="950" y="642" width="160" height="60" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="1030" y="680" font-size="23" fill="#16324f" text-anchor="middle">GPU …</text><rect x="750" y="553" width="300" height="64" rx="14" fill="#dcfce7" stroke="#cbd5e1"/><text x="900" y="593" font-size="23" fill="#16324f" text-anchor="middle">NVLink / NVSwitch</text><text x="600" y="785" font-size="23" fill="#16324f" text-anchor="middle">域内：高带宽、低延迟协作；域间：通过网络扩展集群规模</text><text x="600" y="825" font-size="20" fill="#64748b" text-anchor="middle">每个域可覆盖多 GPU 服务器或多个计算托盘；端口数量与布线为概念示意</text></svg>
