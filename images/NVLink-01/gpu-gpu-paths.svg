<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">GPU 到 GPU 的三条数据路径</title>
  <desc id="desc">未启用 P2P 时数据经主机内存中转；启用 PCIe P2P 后可经 PCIe 交换机直达；存在 NVLink 时 CUDA P2P 走 NVLink。</desc>
  
    <defs>
      <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
        <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
      </marker>
      <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
      </marker>
      <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
      </marker>
      <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
      </marker>
      <style>
        .text{font-family:Inter, 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;fill:#0f172a}
        .muted{fill:#64748b}
        .center{text-anchor:middle}
        .end{text-anchor:end}
      </style>
    </defs>
  <rect width="1600" height="780" fill="#f8fafc"/>
  
  <text class="text" x="58" y="58" font-size="34" font-weight="800">GPU–GPU 传输的三条路径</text>
  <text class="text muted" x="58" y="96" font-size="18">由是否启用 peer access 以及物理拓扑决定；带宽为标称上限</text>

  
    <g filter="url(#shadow)"><rect x="48" y="128" width="504" height="592" rx="26" fill="#ffffff" stroke="#cbd5e1"/></g>
    <rect x="76" y="152" width="448" height="64" rx="16" fill="#fef2f2" stroke="#fecaca"/>
    <text class="text center" x="300" y="178" font-size="20" font-weight="800">1. Host Staging</text>
    <text class="text center muted" x="300" y="202" font-size="14">未启用 P2P</text>
    
    <rect x="168" y="236" width="160" height="70" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="248" y="278" font-size="18" font-weight="800">GPU 0</text>
    <path d="M248 306 V344" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)"/>
    <rect x="138" y="350" width="220" height="64" rx="14" fill="#e2e8f0" stroke="#94a3b8"/>
    <text class="text center" x="248" y="388" font-size="16" font-weight="750">Host Memory</text>
    <path d="M248 414 V452" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)"/>
    <rect x="168" y="458" width="160" height="70" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="248" y="500" font-size="18" font-weight="800">GPU 1</text>
    <text class="text center" x="248" y="580" font-size="16" font-weight="750">两次 PCIe 拷贝</text>
    <text class="text center muted" x="248" y="610" font-size="14">最慢，占用主机带宽</text>
    <text class="text center" x="248" y="660" font-size="18" font-weight="800" fill="#b91c1c">有效带宽 ≤ β_PCIe / 2</text>
  
  

  
    <g filter="url(#shadow)"><rect x="548" y="128" width="504" height="592" rx="26" fill="#ffffff" stroke="#cbd5e1"/></g>
    <rect x="576" y="152" width="448" height="64" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <text class="text center" x="800" y="178" font-size="20" font-weight="800">2. PCIe P2P</text>
    <text class="text center muted" x="800" y="202" font-size="14">cudaDeviceEnablePeerAccess</text>
    
    <rect x="618" y="230" width="160" height="70" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="698" y="272" font-size="18" font-weight="800">GPU 0</text>
    <path d="M698 300 V348" stroke="#d97706" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="588" y="354" width="220" height="70" rx="14" fill="#ffedd5" stroke="#fdba74"/>
    <text class="text center" x="698" y="384" font-size="16" font-weight="750">PCIe Switch</text>
    <text class="text center muted" x="698" y="408" font-size="13">或 Root Complex</text>
    <path d="M698 424 V472" stroke="#d97706" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="618" y="478" width="160" height="70" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="698" y="520" font-size="18" font-weight="800">GPU 1</text>
    <text class="text center" x="698" y="600" font-size="16" font-weight="750">设备间 DMA</text>
    <text class="text center muted" x="698" y="630" font-size="14">仍受 PCIe 代数和共享拓扑限制</text>
    <text class="text center" x="698" y="670" font-size="18" font-weight="800" fill="#b45309">Gen5：64 GB/s 单向</text>
  
  

  
    <g filter="url(#shadow)"><rect x="1048" y="128" width="504" height="592" rx="26" fill="#ffffff" stroke="#cbd5e1"/></g>
    <rect x="1076" y="152" width="448" height="64" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text class="text center" x="1300" y="178" font-size="20" font-weight="800">3. NVLink P2P</text>
    <text class="text center muted" x="1300" y="202" font-size="14">拓扑支持时自动走 NVLink</text>
    
    <rect x="1118" y="250" width="160" height="88" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="1198" y="292" font-size="18" font-weight="800">GPU 0</text>
    <text class="text center muted" x="1198" y="318" font-size="13">Load / Store / Copy</text>
    <line x1="1198" y1="338" x2="1198" y2="430" stroke="#059669" stroke-width="12" stroke-linecap="round"/>
    <text class="text center" x="1268" y="392" font-size="14" font-weight="750" fill="#047857">NVLink</text>
    <rect x="1118" y="436" width="160" height="88" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="1198" y="478" font-size="18" font-weight="800">GPU 1</text>
    <text class="text center muted" x="1198" y="504" font-size="13">Peer Memory</text>
    <text class="text center" x="1198" y="580" font-size="16" font-weight="750">专用 GPU 互连</text>
    <text class="text center muted" x="1198" y="610" font-size="14">H100：450 GB/s 单向峰值</text>
    <text class="text center" x="1198" y="660" font-size="18" font-weight="800" fill="#047857">7× PCIe Gen5 x16</text>
  
  
  
</svg>
