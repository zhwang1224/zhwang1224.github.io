<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
<title id="title">从 PCIe 到 NVLink 与 NVSwitch</title><desc id="desc">四种数据路径：主机中转、PCIe P2P、NVLink 直连、经 NVSwitch 的 NVLink 交换。</desc>
<style>text{font-family:'Microsoft YaHei','Noto Sans SC','Segoe UI',sans-serif}</style>
<rect x="0" y="0" width="1200" height="1160" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="40" y="52" font-size="32" fill="#16324f" text-anchor="start">从 PCIe 数据路径到 NVLink 交换域</text><text x="40" y="89" font-size="21" fill="#64748b" text-anchor="start">关键变化：省去主机中转 → 提高 GPU 互连带宽 → 支持多 GPU 交换</text><rect x="28" y="120" width="1144" height="186" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="52" y="157" font-size="25" fill="#16324f" text-anchor="start">1  主机内存中转</text><text x="52" y="281" font-size="20" fill="#64748b" text-anchor="start">GPU → 主机内存 → GPU；图中 CPU 框表示主机侧路径</text><rect x="28" y="330" width="1144" height="186" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="52" y="367" font-size="25" fill="#16324f" text-anchor="start">2  PCIe P2P</text><text x="52" y="491" font-size="20" fill="#64748b" text-anchor="start">在受支持拓扑上直接访问对端显存，无须经过主机内存</text><rect x="28" y="540" width="1144" height="186" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="52" y="577" font-size="25" fill="#16324f" text-anchor="start">3  NVLink 直连</text><text x="52" y="701" font-size="20" fill="#64748b" text-anchor="start">为 GPU–GPU 通信提供专用链路；PCIe 仍可承担主机与设备 I/O</text><rect x="28" y="750" width="1144" height="340" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="52" y="787" font-size="25" fill="#16324f" text-anchor="start">4  NVLink + NVSwitch</text><text x="52" y="1058" font-size="20" fill="#64748b" text-anchor="start">交换网络连接多个 GPU；每卡总注入带宽仍有限</text><line x1="280" y1="210" x2="425" y2="210" stroke="#d97706" stroke-width="5"/><line x1="775" y1="210" x2="920" y2="210" stroke="#d97706" stroke-width="5"/><rect x="70" y="177" width="210" height="66" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="175" y="218" font-size="23" fill="#16324f" text-anchor="middle">GPU 0</text><rect x="920" y="177" width="210" height="66" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="1025" y="218" font-size="23" fill="#16324f" text-anchor="middle">GPU 1</text><rect x="425" y="177" width="350" height="66" rx="14" fill="#ffedd5" stroke="#cbd5e1"/><text x="600" y="218" font-size="23" fill="#16324f" text-anchor="middle">CPU / 主机内存</text><text x="350" y="197" font-size="19" fill="#92400e" text-anchor="middle">PCIe</text><text x="850" y="197" font-size="19" fill="#92400e" text-anchor="middle">PCIe</text><line x1="280" y1="420" x2="425" y2="420" stroke="#d97706" stroke-width="5"/><line x1="775" y1="420" x2="920" y2="420" stroke="#d97706" stroke-width="5"/><rect x="70" y="387" width="210" height="66" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="175" y="428" font-size="23" fill="#16324f" text-anchor="middle">GPU 0</text><rect x="920" y="387" width="210" height="66" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="1025" y="428" font-size="23" fill="#16324f" text-anchor="middle">GPU 1</text><rect x="425" y="387" width="350" height="66" rx="14" fill="#ffedd5" stroke="#cbd5e1"/><text x="600" y="428" font-size="23" fill="#16324f" text-anchor="middle">PCIe Switch / Host Bridge</text><text x="350" y="407" font-size="19" fill="#92400e" text-anchor="middle">PCIe</text><text x="850" y="407" font-size="19" fill="#92400e" text-anchor="middle">PCIe</text><line x1="330" y1="631" x2="870" y2="631" stroke="#059669" stroke-width="10"/><rect x="70" y="597" width="260" height="68" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="200" y="639" font-size="23" fill="#16324f" text-anchor="middle">GPU 0</text><rect x="870" y="597" width="260" height="68" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="1000" y="639" font-size="23" fill="#16324f" text-anchor="middle">GPU 1</text><text x="600" y="616" font-size="25" fill="#047857" text-anchor="middle">NVLink × N</text><line x1="285" y1="847" x2="455" y2="909" stroke="#059669" stroke-width="5"/><line x1="745" y1="909" x2="915" y2="847" stroke="#059669" stroke-width="5"/><line x1="285" y1="958" x2="455" y2="909" stroke="#059669" stroke-width="5"/><line x1="745" y1="909" x2="915" y2="958" stroke="#059669" stroke-width="5"/><rect x="70" y="812" width="215" height="70" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="177.5" y="855" font-size="23" fill="#16324f" text-anchor="middle">GPU 0</text><rect x="70" y="923" width="215" height="70" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="177.5" y="966" font-size="23" fill="#16324f" text-anchor="middle">GPU 1</text><rect x="915" y="812" width="215" height="70" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="1022.5" y="855" font-size="23" fill="#16324f" text-anchor="middle">GPU 2</text><rect x="915" y="923" width="215" height="70" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="1022.5" y="966" font-size="23" fill="#16324f" text-anchor="middle">GPU 3</text><rect x="455" y="859" width="290" height="100" rx="14" fill="#dcfce7" stroke="#cbd5e1"/><text x="600" y="917" font-size="23" fill="#16324f" text-anchor="middle">NVSwitch Fabric</text><text x="355" y="910" font-size="19" fill="#047857" text-anchor="middle">NVLink</text><text x="835" y="910" font-size="19" fill="#047857" text-anchor="middle">NVLink</text><text x="600" y="1133" font-size="20" fill="#64748b" text-anchor="middle">认知顺序示意；各路径可并存，实际系统可能包含多颗交换芯片</text></svg>
