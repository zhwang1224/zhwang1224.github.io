<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc">
  <title id="title">列并行与行并行线性层</title>
  <desc id="desc">左侧展示逻辑权重矩阵按输出维度做列切分，每个 Rank 产生不同输出通道，可按最后一维拼接。右侧展示权重按输入维度做行切分，每个 Rank 产生同一输出的部分和，必须通过 AllReduce 求和。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="138%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <style>.text{font-family:Inter,'Noto Sans SC','Microsoft YaHei','Segoe UI',Arial,sans-serif;fill:#0f172a}.muted{fill:#64748b}.center{text-anchor:middle}.label{font-size:16px;font-weight:750;text-anchor:middle}.formula{font-size:18px;font-weight:750;text-anchor:middle}</style>
  </defs>
  <rect width="1600" height="1030" fill="#f8fafc"/>
  <text class="text" x="58" y="62" font-size="36" font-weight="800">同一个 Y = XW，两种切法对应两种完全不同的输出语义</text>
  <text class="text muted" x="58" y="104" font-size="19">本文使用逻辑矩阵 W ∈ ℝᵈⁱⁿ×ᵈᵒᵘᵗ；p = 4，颜色表示不同 Rank 持有的权重分片</text>

  <g filter="url(#shadow)"><rect x="48" y="150" width="730" height="765" rx="26" fill="#ffffff" stroke="#cbd5e1"/><rect x="822" y="150" width="730" height="765" rx="26" fill="#ffffff" stroke="#cbd5e1"/></g>
  <text class="text center" x="413" y="202" font-size="26" font-weight="800">Column Parallel · 切输出维度</text>
  <text class="text center muted" x="413" y="236" font-size="16">W = [ W₀  W₁  W₂  W₃ ]</text>
  <text class="text center" x="1187" y="202" font-size="26" font-weight="800">Row Parallel · 切输入维度</text>
  <text class="text center muted" x="1187" y="236" font-size="16">W = [ W₀ᵀ  W₁ᵀ  W₂ᵀ  W₃ᵀ ]ᵀ</text>

  <!-- Column parallel. -->
  <rect x="82" y="330" width="126" height="220" rx="14" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="text center" x="145" y="430" font-size="22" font-weight="800">X</text><text class="text center muted" x="145" y="462" font-size="14">Replicated</text>
  <text class="text center" x="232" y="446" font-size="28" font-weight="800">×</text>
  <g>
    <rect x="268" y="300" width="105" height="280" fill="#dbeafe" stroke="#60a5fa"/><rect x="373" y="300" width="105" height="280" fill="#dcfce7" stroke="#4ade80"/>
    <rect x="478" y="300" width="105" height="280" fill="#ffedd5" stroke="#fb923c"/><rect x="583" y="300" width="105" height="280" fill="#ede9fe" stroke="#a78bfa"/>
  </g>
  <g class="text center" font-size="18" font-weight="800"><text x="320" y="446">W₀</text><text x="425" y="446">W₁</text><text x="530" y="446">W₂</text><text x="635" y="446">W₃</text></g>
  <text class="text center muted" x="478" y="610" font-size="15">每个 Wᵢ：dᵢₙ × (dₒᵤₜ / p)</text>
  <path d="M170 646 H692" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect x="120" y="684" width="140" height="82" rx="12" fill="#dbeafe" stroke="#60a5fa"/><rect x="270" y="684" width="140" height="82" rx="12" fill="#dcfce7" stroke="#4ade80"/>
    <rect x="420" y="684" width="140" height="82" rx="12" fill="#ffedd5" stroke="#fb923c"/><rect x="570" y="684" width="140" height="82" rx="12" fill="#ede9fe" stroke="#a78bfa"/>
  </g>
  <g class="text label"><text x="190" y="718">Y₀ = XW₀</text><text x="340" y="718">Y₁ = XW₁</text><text x="490" y="718">Y₂ = XW₂</text><text x="640" y="718">Y₃ = XW₃</text></g>
  <g class="text center muted" font-size="13"><text x="190" y="744">不同输出通道</text><text x="340" y="744">不同输出通道</text><text x="490" y="744">不同输出通道</text><text x="640" y="744">不同输出通道</text></g>
  <text class="text formula" x="413" y="824">Y = Concat(Y₀, Y₁, Y₂, Y₃)</text>
  <text class="text center muted" x="413" y="858" font-size="15">需要完整 Y 时才 AllGather；可让逐元素运算直接消费分片</text>

  <!-- Row parallel. -->
  <g><rect x="858" y="350" width="68" height="180" fill="#dbeafe" stroke="#60a5fa"/><rect x="926" y="350" width="68" height="180" fill="#dcfce7" stroke="#4ade80"/><rect x="994" y="350" width="68" height="180" fill="#ffedd5" stroke="#fb923c"/><rect x="1062" y="350" width="68" height="180" fill="#ede9fe" stroke="#a78bfa"/></g>
  <g class="text center" font-size="15" font-weight="800"><text x="892" y="446">X₀</text><text x="960" y="446">X₁</text><text x="1028" y="446">X₂</text><text x="1096" y="446">X₃</text></g>
  <text class="text center" x="1152" y="446" font-size="28" font-weight="800">×</text>
  <g><rect x="1190" y="300" width="270" height="70" fill="#dbeafe" stroke="#60a5fa"/><rect x="1190" y="370" width="270" height="70" fill="#dcfce7" stroke="#4ade80"/><rect x="1190" y="440" width="270" height="70" fill="#ffedd5" stroke="#fb923c"/><rect x="1190" y="510" width="270" height="70" fill="#ede9fe" stroke="#a78bfa"/></g>
  <g class="text center" font-size="18" font-weight="800"><text x="1325" y="342">W₀</text><text x="1325" y="412">W₁</text><text x="1325" y="482">W₂</text><text x="1325" y="552">W₃</text></g>
  <text class="text center muted" x="1187" y="610" font-size="15">Xᵢ：[N, dᵢₙ/p]　Wᵢ：[dᵢₙ/p, dₒᵤₜ]</text>
  <path d="M910 646 H1468" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g><rect x="868" y="684" width="140" height="82" rx="12" fill="#dbeafe" stroke="#60a5fa"/><rect x="1018" y="684" width="140" height="82" rx="12" fill="#dcfce7" stroke="#4ade80"/><rect x="1168" y="684" width="140" height="82" rx="12" fill="#ffedd5" stroke="#fb923c"/><rect x="1318" y="684" width="140" height="82" rx="12" fill="#ede9fe" stroke="#a78bfa"/></g>
  <g class="text label"><text x="938" y="718">Z₀ = X₀W₀</text><text x="1088" y="718">Z₁ = X₁W₁</text><text x="1238" y="718">Z₂ = X₂W₂</text><text x="1388" y="718">Z₃ = X₃W₃</text></g>
  <g class="text center muted" font-size="13"><text x="938" y="744">Partial</text><text x="1088" y="744">Partial</text><text x="1238" y="744">Partial</text><text x="1388" y="744">Partial</text></g>
  <rect x="954" y="796" width="466" height="62" rx="31" fill="#fee2e2" stroke="#fca5a5"/>
  <text class="text formula" x="1187" y="835">AllReduce(SUM)：Y = Z₀ + Z₁ + Z₂ + Z₃</text>
  <text class="text center muted" x="1187" y="886" font-size="15">不能 Concat：每个 Zᵢ 都是同一输出元素的部分贡献</text>

  <rect x="246" y="950" width="1108" height="48" rx="24" fill="#fff7ed" stroke="#fed7aa"/>
  <text class="text center" x="800" y="981" font-size="16" font-weight="750">PyTorch nn.Linear.weight 存储为 [out, in]，直接看存储张量时切分方向会与本文逻辑矩阵 W 的画法转置</text>
</svg>
