<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">NVLink 的技术演进</title><desc id="desc">从 Pascal 专用链路到 Volta 交换系统、Hopper 跨节点网络和 Blackwell、Rubin 机架级系统。第六代以 DGX Vera Rubin NVL72 为准。</desc><style>text{font-family:'Microsoft YaHei','Noto Sans SC','Segoe UI',sans-serif}</style><rect width="1200" height="1010" fill="#f8fafc"/><text x="44" y="57" font-size="34" fill="#15324f">NVLink 的技术演进</text><text x="44" y="97" font-size="23" fill="#52677d">链路提速 → 交换网络 → 跨节点连接 → 机架级系统</text><rect x="36" y="132" width="1128" height="116" rx="16" fill="white" stroke="#cbd5e1"/><rect x="36" y="132" width="9" height="116" rx="4" fill="#2563eb"/><text x="62" y="169" font-size="21" fill="#52677d">2016</text><text x="220" y="169" font-size="25" fill="#15324f">NVLink 1 · Pascal</text><text x="220" y="203" font-size="23" fill="#15324f">GPU 专用高速连接</text><text x="220" y="233" font-size="20" fill="#52677d">P100 SXM2：4 条链路，双向合计 160 GB/s</text><rect x="36" y="266" width="1128" height="116" rx="16" fill="white" stroke="#cbd5e1"/><rect x="36" y="266" width="9" height="116" rx="4" fill="#059669"/><text x="62" y="303" font-size="21" fill="#52677d">2017–18</text><text x="220" y="303" font-size="25" fill="#15324f">NVLink 2 · Volta</text><text x="220" y="337" font-size="23" fill="#15324f">从直接连接到交换网络</text><text x="220" y="367" font-size="20" fill="#52677d">V100：300 GB/s；DGX-2 引入 NVSwitch</text><rect x="36" y="400" width="1128" height="116" rx="16" fill="white" stroke="#cbd5e1"/><rect x="36" y="400" width="9" height="116" rx="4" fill="#2563eb"/><text x="62" y="437" font-size="21" fill="#52677d">2020</text><text x="220" y="437" font-size="25" fill="#15324f">NVLink 3 · Ampere</text><text x="220" y="471" font-size="23" fill="#15324f">提高带宽，丰富基板配置</text><text x="220" y="501" font-size="20" fill="#52677d">A100：600 GB/s；直接连接与交换连接并存</text><rect x="36" y="534" width="1128" height="116" rx="16" fill="white" stroke="#cbd5e1"/><rect x="36" y="534" width="9" height="116" rx="4" fill="#059669"/><text x="62" y="571" font-size="21" fill="#52677d">2022</text><text x="220" y="571" font-size="25" fill="#15324f">NVLink 4 · Hopper</text><text x="220" y="605" font-size="23" fill="#15324f">跨节点网络与集合通信卸载</text><text x="220" y="635" font-size="20" fill="#52677d">H100：900 GB/s；NVLink Network、SHARP</text><rect x="36" y="668" width="1128" height="116" rx="16" fill="white" stroke="#cbd5e1"/><rect x="36" y="668" width="9" height="116" rx="4" fill="#2563eb"/><text x="62" y="705" font-size="21" fill="#52677d">2024</text><text x="220" y="705" font-size="25" fill="#15324f">NVLink 5 · Blackwell</text><text x="220" y="739" font-size="23" fill="#15324f">机架级高速互连域</text><text x="220" y="769" font-size="20" fill="#52677d">每 GPU 1.8 TB/s；NVL72 连接 72 张 GPU</text><rect x="36" y="802" width="1128" height="116" rx="16" fill="white" stroke="#cbd5e1"/><rect x="36" y="802" width="9" height="116" rx="4" fill="#059669"/><text x="62" y="839" font-size="21" fill="#52677d">2026</text><text x="220" y="839" font-size="25" fill="#15324f">NVLink 6 · Vera Rubin</text><text x="220" y="873" font-size="23" fill="#15324f">更高带宽与机架级维护能力</text><text x="220" y="903" font-size="20" fill="#52677d">DGX Vera Rubin NVL72：18 条链路，双向合计 3.6 TB/s</text><text x="44" y="977" font-size="20" fill="#52677d">注：带宽为每 GPU 双向聚合值；系统示例不代表每代唯一拓扑。</text></svg>
