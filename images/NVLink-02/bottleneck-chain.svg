<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">NVLink 代际所针对的可扩展性瓶颈</title>
  <desc id="desc">从提高 SerDes 与 link 数，到引入 NVSwitch、跨节点 NVLink Network，再到机架级 NVL72。</desc>
  
    <defs>
      <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
        <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
      </marker>
      <style>
        .text{font-family:Inter, 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;fill:#0f172a}
        .muted{fill:#64748b}
        .center{text-anchor:middle}
      </style>
    </defs>
  <rect width="1600" height="820" fill="#f8fafc"/>
  
  <text class="text" x="58" y="56" font-size="32" font-weight="800">每一代 NVLink 针对的瓶颈</text>
  <text class="text muted" x="58" y="92" font-size="17">带宽数字是结果；拓扑与 domain 规模才是结构变化</text>

  
    <g filter="url(#shadow)"><rect x="48" y="130" width="180" height="210" rx="18" fill="#ffffff" stroke="#cbd5e1"/></g>
    <rect x="64" y="146" width="148" height="36" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="138" y="170" font-size="13" font-weight="750">NVLink 1–2</text>
    <text class="text center" x="138" y="222" font-size="18" font-weight="800">SerDes + link 数</text>
    <text class="text center" x="138" y="278" font-size="14">P100 4×40 GB/s</text><text class="text center muted" x="138" y="302" font-size="13">V100 6×50 GB/s</text>
  
  <path d="M268 250 H300" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  
    <g filter="url(#shadow)"><rect x="308" y="130" width="180" height="210" rx="18" fill="#ffffff" stroke="#cbd5e1"/></g>
    <rect x="324" y="146" width="148" height="36" rx="12" fill="#fce7f3" stroke="#f472b6"/>
    <text class="text center" x="398" y="170" font-size="13" font-weight="750">2018</text>
    <text class="text center" x="398" y="222" font-size="18" font-weight="800">NVSwitch</text>
    <text class="text center" x="398" y="278" font-size="14">点对点布线无法</text><text class="text center muted" x="398" y="302" font-size="13">全连接满带宽</text>
  
  <path d="M528 250 H560" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  
    <g filter="url(#shadow)"><rect x="568" y="130" width="180" height="210" rx="18" fill="#ffffff" stroke="#cbd5e1"/></g>
    <rect x="584" y="146" width="148" height="36" rx="12" fill="#dcfce7" stroke="#4ade80"/>
    <text class="text center" x="658" y="170" font-size="13" font-weight="750">NVLink 3</text>
    <text class="text center" x="658" y="222" font-size="18" font-weight="800">8-GPU 积木</text>
    <text class="text center" x="658" y="278" font-size="14">A100 12 link</text><text class="text center muted" x="658" y="302" font-size="13">600 GB/s 任意对</text>
  
  <path d="M788 250 H820" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  
    <g filter="url(#shadow)"><rect x="828" y="130" width="180" height="210" rx="18" fill="#ffffff" stroke="#cbd5e1"/></g>
    <rect x="844" y="146" width="148" height="36" rx="12" fill="#ffedd5" stroke="#fb923c"/>
    <text class="text center" x="918" y="170" font-size="13" font-weight="750">NVLink 4</text>
    <text class="text center" x="918" y="222" font-size="18" font-weight="800">NVLink Network</text>
    <text class="text center" x="918" y="278" font-size="14">域跨出机箱</text><text class="text center muted" x="918" y="302" font-size="13">至 256 GPU</text>
  
  <path d="M1048 250 H1080" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  
    <g filter="url(#shadow)"><rect x="1088" y="130" width="180" height="210" rx="18" fill="#ffffff" stroke="#cbd5e1"/></g>
    <rect x="1104" y="146" width="148" height="36" rx="12" fill="#ede9fe" stroke="#a78bfa"/>
    <text class="text center" x="1178" y="170" font-size="13" font-weight="750">NVLink 5</text>
    <text class="text center" x="1178" y="222" font-size="18" font-weight="800">NVL72</text>
    <text class="text center" x="1178" y="278" font-size="14">72 GPU 单层</text><text class="text center muted" x="1178" y="302" font-size="13">无超额订阅</text>
  
  <path d="M1308 250 H1340" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  
    <g filter="url(#shadow)"><rect x="1348" y="130" width="180" height="210" rx="18" fill="#ffffff" stroke="#cbd5e1"/></g>
    <rect x="1364" y="146" width="148" height="36" rx="12" fill="#e0f2fe" stroke="#38bdf8"/>
    <text class="text center" x="1438" y="170" font-size="13" font-weight="750">NVLink 6</text>
    <text class="text center" x="1438" y="222" font-size="18" font-weight="800">rack ×2 + RAS</text>
    <text class="text center" x="1438" y="278" font-size="14">3.6 TB/s/GPU</text><text class="text center muted" x="1438" y="302" font-size="13">260 TB/s/rack</text>
  

  <g filter="url(#shadow)"><rect x="48" y="430" width="1504" height="340" rx="24" fill="#ffffff" stroke="#cbd5e1"/></g>
  <text class="text" x="80" y="478" font-size="20" font-weight="800">瓶颈迁移</text>
  <text class="text muted" x="80" y="520" font-size="16">1. PCIe 树无法承载 GPU–GPU 一等流量 → 专用 link（NVLink 1）</text>
  <text class="text muted" x="80" y="556" font-size="16">2. 有限 link 无法使 n 个 GPU 两两满带宽 → 交换芯片（NVSwitch）</text>
  <text class="text muted" x="80" y="592" font-size="16">3. 8 GPU 域装不下宽 TP / AllToAll → 跨节点 NVLink Network（至 256）</text>
  <text class="text muted" x="80" y="628" font-size="16">4. 跨节点仍有超额订阅与光学功耗 → 机架内铜缆单层织物（NVL72）</text>
  <text class="text muted" x="80" y="664" font-size="16">5. MoE / 长上下文继续加压注入带宽与可用性 → NVLink 6 加倍带宽并引入机架级 RAS</text>
  <text class="text muted" x="80" y="716" font-size="15">数字取双向标称注入带宽。NVLink 6 的 3.6 TB/s、260 TB/s 引自 NVIDIA Technical Blog（2026-07-20）。</text>
  
</svg>
