<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Cube Mesh 与 NVSwitch 全连接</title>
  <desc id="desc">左：DGX-1 的点对点 Hybrid Cube Mesh，度数受 link 数限制。右：经 NVSwitch 后任意 GPU 对保持满注入带宽。</desc>
  
    <defs>
      <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
        <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
      </filter>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
      </marker>
      <style>
        .text{font-family:Inter, 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;fill:#0f172a}
        .muted{fill:#64748b}
        .center{text-anchor:middle}
      </style>
    </defs>
  <rect width="1600" height="780" fill="#f8fafc"/>
  
  <text class="text" x="58" y="56" font-size="32" font-weight="800">点对点网格与交换式全连接</text>
  <text class="text muted" x="58" y="92" font-size="17">度数有限时，n 增大则部分 GPU 对只能经多跳或分摊带宽</text>

  <g filter="url(#shadow)"><rect x="48" y="128" width="730" height="580" rx="24" fill="#ffffff" stroke="#cbd5e1"/></g>
  <text class="text center" x="413" y="172" font-size="22" font-weight="800">Hybrid Cube Mesh</text>
  <text class="text center muted" x="413" y="202" font-size="15">DGX-1 · P100 4 link / V100 6 link</text>
  
    <rect x="198" y="280" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="248" y="316" font-size="16" font-weight="750">G0</text>
   
    <rect x="348" y="280" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="398" y="316" font-size="16" font-weight="750">G1</text>
   
    <rect x="498" y="280" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="548" y="316" font-size="16" font-weight="750">G2</text>
   
    <rect x="648" y="280" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="698" y="316" font-size="16" font-weight="750">G3</text>
  
  
    <rect x="198" y="470" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="248" y="506" font-size="16" font-weight="750">G4</text>
   
    <rect x="348" y="470" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="398" y="506" font-size="16" font-weight="750">G5</text>
   
    <rect x="498" y="470" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="548" y="506" font-size="16" font-weight="750">G6</text>
   
    <rect x="648" y="470" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="698" y="506" font-size="16" font-weight="750">G7</text>
  
  <line x1="248" y1="330" x2="348" y2="330" stroke="#64748b" stroke-width="3"/>
  <line x1="398" y1="330" x2="498" y2="330" stroke="#64748b" stroke-width="3"/>
  <line x1="548" y1="330" x2="648" y2="330" stroke="#64748b" stroke-width="3"/>
  <line x1="248" y1="520" x2="348" y2="520" stroke="#64748b" stroke-width="3"/>
  <line x1="398" y1="520" x2="498" y2="520" stroke="#64748b" stroke-width="3"/>
  <line x1="548" y1="520" x2="648" y2="520" stroke="#64748b" stroke-width="3"/>
  <line x1="248" y1="380" x2="248" y2="470" stroke="#64748b" stroke-width="3"/>
  <line x1="398" y1="380" x2="398" y2="470" stroke="#64748b" stroke-width="3"/>
  <line x1="548" y1="380" x2="548" y2="470" stroke="#64748b" stroke-width="3"/>
  <line x1="698" y1="380" x2="698" y2="470" stroke="#64748b" stroke-width="3"/>
  <line x1="248" y1="330" x2="398" y2="520" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="398" y1="330" x2="248" y2="520" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="text center muted" x="413" y="640" font-size="14">部分边为单 link，部分为双 link；直径为 2</text>
  <text class="text center" x="413" y="668" font-size="15" font-weight="700">任意对带宽随拓扑位置变化</text>

  <g filter="url(#shadow)"><rect x="822" y="128" width="730" height="580" rx="24" fill="#ffffff" stroke="#cbd5e1"/></g>
  <text class="text center" x="1187" y="172" font-size="22" font-weight="800">NVSwitch 全连接</text>
  <text class="text center muted" x="1187" y="202" font-size="15">DGX-2 / HGX A100 / HGX H100</text>
  <rect x="972" y="250" width="430" height="90" rx="16" fill="#ede9fe" stroke="#a78bfa"/>
  <text class="text center" x="1187" y="304" font-size="20" font-weight="800">NVSwitch × N</text>
  
    <rect x="892" y="400" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="942" y="436" font-size="16" font-weight="750">G0</text>
   
    <rect x="1042" y="400" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="1092" y="436" font-size="16" font-weight="750">G1</text>
   
    <rect x="1192" y="400" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="1242" y="436" font-size="16" font-weight="750">G2</text>
   
    <rect x="1342" y="400" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="1392" y="436" font-size="16" font-weight="750">G3</text>
  
  
    <rect x="892" y="520" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="942" y="556" font-size="16" font-weight="750">G4</text>
   
    <rect x="1042" y="520" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="1092" y="556" font-size="16" font-weight="750">G5</text>
   
    <rect x="1192" y="520" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="1242" y="556" font-size="16" font-weight="750">G6</text>
   
    <rect x="1342" y="520" width="100" height="60" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="text center" x="1392" y="556" font-size="16" font-weight="750">G7</text>
  
  <line x1="942" y1="400" x2="1187" y2="340" stroke="#7c3aed" stroke-width="2"/>
  <line x1="1092" y1="400" x2="1187" y2="340" stroke="#7c3aed" stroke-width="2"/>
  <line x1="1242" y1="400" x2="1187" y2="340" stroke="#7c3aed" stroke-width="2"/>
  <line x1="1392" y1="400" x2="1187" y2="340" stroke="#7c3aed" stroke-width="2"/>
  <line x1="942" y1="520" x2="1187" y2="340" stroke="#7c3aed" stroke-width="2"/>
  <line x1="1092" y1="520" x2="1187" y2="340" stroke="#7c3aed" stroke-width="2"/>
  <line x1="1242" y1="520" x2="1187" y2="340" stroke="#7c3aed" stroke-width="2"/>
  <line x1="1392" y1="520" x2="1187" y2="340" stroke="#7c3aed" stroke-width="2"/>
  <text class="text center muted" x="1187" y="640" font-size="14">每 GPU 的全部 link 注入交换机</text>
  <text class="text center" x="1187" y="668" font-size="15" font-weight="700">任意对保持满注入带宽（非阻塞）</text>
  
</svg>
