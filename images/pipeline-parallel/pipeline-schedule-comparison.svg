  </g>
  <text class="text note" x="82" y="1045"><tspan font-weight="800">重点：</tspan>与 GPipe 的理想气泡总量相近，主要收益是 B₀ 更早开始、同时存活的激活更少；同步语义不变。</text>

  <!-- Panel C: asynchronous PipeDream. -->
  <g filter="url(#shadow)"><rect x="48" y="1095" width="1504" height="620" rx="26" fill="#ffffff" stroke="#cbd5e1"/></g>
  <text class="text title" x="82" y="1142">C. PipeDream 异步 1F1B：不做周期性 Flush，Micro-batch 连续流入</text>
  <text class="text muted" x="82" y="1172" font-size="16">图中 0～3 与 4～6 只是连续编号，不代表两个同步 Pipeline Batch；稳态下不会在编号边界等待全部反向完成</text>
