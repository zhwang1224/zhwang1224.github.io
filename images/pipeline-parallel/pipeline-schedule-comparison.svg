<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" role="img" aria-labelledby="title desc">
  <title id="title">GPipe、同步 1F1B 与 PipeDream 异步 1F1B 调度对比</title>
  <desc id="desc">在四个流水线阶段的统一时间轴上，对比 GPipe 先完成全部前向再反向、同步 1F1B 在预热后交替前向和反向并最终排空、以及 PipeDream 异步 1F1B 不设置批次排空边界而持续执行的区别。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <style>
      .text { font-family: Inter, 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .muted { fill: #64748b; }
      .title { font-size: 25px; font-weight: 800; }
      .stage { font-size: 16px; font-weight: 760; text-anchor: end; }
      .tick { font-size: 13px; text-anchor: middle; fill: #64748b; }
      .cell { font-size: 15px; font-weight: 800; text-anchor: middle; }
      .note { font-size: 16px; }
    </style>
  </defs>
  <rect width="1600" height="1800" fill="#f8fafc"/>

  <text class="text" x="58" y="58" font-size="36" font-weight="800">同样是流水线，差别在 Forward / Backward 何时交替</text>
  <text class="text muted" x="58" y="100" font-size="19">简化假设：K = 4，各 Stage 计算时间相同，忽略通信与优化器耗时；空白格表示设备等待</text>
  <g transform="translate(1050 42)">
    <rect width="154" height="42" rx="21" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="170" width="154" height="42" rx="21" fill="#fce7f3" stroke="#f9a8d4"/>
    <rect x="340" width="180" height="42" rx="21" fill="#dcfce7" stroke="#86efac"/>
    <text class="text" x="77" y="27" text-anchor="middle" font-size="14" font-weight="750">Fₘ：前向</text>
    <text class="text" x="247" y="27" text-anchor="middle" font-size="14" font-weight="750">Bₘ：反向</text>
    <circle cx="364" cy="21" r="6" fill="#16a34a"/>
    <text class="text" x="380" y="27" font-size="14" font-weight="750">局部参数更新</text>
  </g>

  <!-- Panel A: GPipe. -->
  <g filter="url(#shadow)"><rect x="48" y="145" width="1504" height="445" rx="26" fill="#ffffff" stroke="#cbd5e1"/></g>
  <text class="text title" x="82" y="192">A. GPipe / Fill-Drain：全部 Forward → 全部 Backward</text>
  <text class="text muted" x="82" y="222" font-size="16">M = 4；同一 Pipeline Batch 的所有计算使用同一参数版本，最后统一执行一次 Optimizer Step</text>
  <g class="text tick">
    <text x="323" y="260">t0</text><text x="409" y="260">t1</text><text x="495" y="260">t2</text><text x="581" y="260">t3</text>
    <text x="667" y="260">t4</text><text x="753" y="260">t5</text><text x="839" y="260">t6</text><text x="925" y="260">t7</text>
    <text x="1011" y="260">t8</text><text x="1097" y="260">t9</text><text x="1183" y="260">t10</text><text x="1269" y="260">t11</text>
    <text x="1355" y="260">t12</text><text x="1441" y="260">t13</text>
  </g>
  <g class="text stage">
    <text x="250" y="309">Stage 0</text><text x="250" y="374">Stage 1</text><text x="250" y="439">Stage 2</text><text x="250" y="504">Stage 3</text>
  </g>
