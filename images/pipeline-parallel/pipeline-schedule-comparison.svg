  </g>
  <text class="text note" x="82" y="570"><tspan font-weight="800">重点：</tspan>反向开始得晚；Stage 需要同时保留多个尚未反向的 Micro-batch 激活。</text>

  <!-- Panel B: synchronous 1F1B. -->
  <g filter="url(#shadow)"><rect x="48" y="620" width="1504" height="445" rx="26" fill="#ffffff" stroke="#cbd5e1"/></g>
  <text class="text title" x="82" y="667">B. 同步 1F1B / 1F1B-Flush：预热后交替 Forward 与 Backward</text>
  <text class="text muted" x="82" y="697" font-size="16">M = 4；允许更早反向并释放激活，但仍在 Pipeline Batch 末尾排空，之后才统一更新参数</text>
