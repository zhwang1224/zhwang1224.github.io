    <rect x="886" y="474" width="78" height="42" rx="8"/><rect x="972" y="474" width="78" height="42" rx="8"/><rect x="1058" y="474" width="78" height="42" rx="8"/><rect x="1144" y="474" width="78" height="42" rx="8"/>
  </g>
  <g class="text cell">
    <text x="323" y="306">F₀</text><text x="409" y="306">F₁</text><text x="495" y="306">F₂</text><text x="581" y="306">F₃</text>
