<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">流水线并行的模型切分与双向通信</title>
  <desc id="desc">二十四个 Transformer Block 被连续切分到四个 Stage。前向传播从左向右传递边界激活，反向传播从右向左传递激活梯度。每个 Stage 只持有本地参数、梯度和优化器状态。</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-pink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#db2777"/>
    </marker>
    <style>
      .text { font-family: Inter, 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .math { font-family: 'Cambria Math', 'STIX Two Math', serif; fill: #0f172a; }
      .muted { fill: #64748b; }
      .stage-title { font-size: 23px; font-weight: 760; }
      .label { font-size: 17px; font-weight: 680; }
      .small { font-size: 15px; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#f8fafc"/>
  <text class="text" x="58" y="58" font-size="36" font-weight="800">流水线并行：沿层切分模型，沿边界传递张量</text>
  <text class="text muted" x="58" y="98" font-size="19">示例：24 个 Transformer Block → 4 个连续 Stage → 4 个计算设备</text>

  <g transform="translate(1205 43)">
    <rect width="335" height="54" rx="27" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="28" cy="27" r="7" fill="#2563eb"/>
    <text class="text" x="49" y="33" font-size="16" font-weight="650">Stage 是逻辑分区，不必严格等于一张 GPU</text>
  </g>

  <!-- Input and loss. -->
  <g filter="url(#shadow)">
    <rect x="42" y="266" width="140" height="112" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="1418" y="266" width="140" height="112" rx="22" fill="#ffffff" stroke="#f9a8d4" stroke-width="1.5"/>
  </g>
  <text class="text label" x="112" y="307" text-anchor="middle">Micro-batch</text>
  <text class="math" x="112" y="345" text-anchor="middle" font-size="28">𝓑ₘ</text>
  <text class="text label" x="1488" y="307" text-anchor="middle">Loss</text>
  <text class="math" x="1488" y="345" text-anchor="middle" font-size="28">ℓₘ</text>

  <!-- Stage cards. -->
  <g filter="url(#shadow)">
    <rect x="220" y="178" width="270" height="344" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="520" y="178" width="270" height="344" rx="24" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="820" y="178" width="270" height="344" rx="24" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="1120" y="178" width="270" height="344" rx="24" fill="#ffffff" stroke="#f9a8d4" stroke-width="1.5"/>
  </g>

  <g>
    <rect x="220" y="178" width="270" height="62" rx="24" fill="#dbeafe"/>
    <path d="M220 216 H490 V240 H220 Z" fill="#dbeafe"/>
    <rect x="520" y="178" width="270" height="62" rx="24" fill="#ccfbf1"/>
    <path d="M520 216 H790 V240 H520 Z" fill="#ccfbf1"/>
    <rect x="820" y="178" width="270" height="62" rx="24" fill="#fef3c7"/>
    <path d="M820 216 H1090 V240 H820 Z" fill="#fef3c7"/>
    <rect x="1120" y="178" width="270" height="62" rx="24" fill="#fce7f3"/>
    <path d="M1120 216 H1390 V240 H1120 Z" fill="#fce7f3"/>
  </g>

  <text class="text stage-title" x="355" y="217" text-anchor="middle">Stage 0 · GPU 0</text>
  <text class="text stage-title" x="655" y="217" text-anchor="middle">Stage 1 · GPU 1</text>
  <text class="text stage-title" x="955" y="217" text-anchor="middle">Stage 2 · GPU 2</text>
  <text class="text stage-title" x="1255" y="217" text-anchor="middle">Stage 3 · GPU 3</text>

  <g class="text" text-anchor="middle">
    <rect x="250" y="270" width="210" height="56" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="label" x="355" y="304">Embedding</text>
    <rect x="250" y="346" width="210" height="86" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="label" x="355" y="381">Transformer Block</text>
    <text class="small muted" x="355" y="408">0 ～ 5</text>

    <rect x="550" y="270" width="210" height="162" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="label" x="655" y="334">Transformer Block</text>
    <text class="small muted" x="655" y="365">6 ～ 11</text>

    <rect x="850" y="270" width="210" height="162" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="label" x="955" y="334">Transformer Block</text>
    <text class="small muted" x="955" y="365">12 ～ 17</text>

    <rect x="1150" y="270" width="210" height="86" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="label" x="1255" y="305">Transformer Block</text>
    <text class="small muted" x="1255" y="332">18 ～ 23</text>
    <rect x="1150" y="376" width="210" height="56" rx="12" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text class="label" x="1255" y="410">Norm + LM Head</text>
  </g>

  <!-- Forward arrows. -->
  <line x1="182" y1="296" x2="208" y2="296" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="490" y1="296" x2="508" y2="296" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="790" y1="296" x2="808" y2="296" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="1090" y1="296" x2="1108" y2="296" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="1390" y1="296" x2="1406" y2="296" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <g class="math" font-size="18" text-anchor="middle">
    <text x="500" y="276">h₁</text>
    <text x="800" y="276">h₂</text>
    <text x="1100" y="276">h₃</text>
  </g>

  <!-- Backward lane. -->
  <path d="M1488 378 V585 H1355" fill="none" stroke="#db2777" stroke-width="4" marker-end="url(#arrow-pink)"/>
  <line x1="1120" y1="585" x2="1082" y2="585" stroke="#db2777" stroke-width="4" marker-end="url(#arrow-pink)"/>
  <line x1="820" y1="585" x2="782" y2="585" stroke="#db2777" stroke-width="4" marker-end="url(#arrow-pink)"/>
  <line x1="520" y1="585" x2="482" y2="585" stroke="#db2777" stroke-width="4" marker-end="url(#arrow-pink)"/>
  <text class="text" x="1488" y="621" text-anchor="middle" font-size="17" font-weight="700" fill="#be185d">Backward</text>
  <g class="math" font-size="18" text-anchor="middle">
    <text x="1100" y="569">∂ℓ/∂h₃</text>
    <text x="800" y="569">∂ℓ/∂h₂</text>
    <text x="500" y="569">∂ℓ/∂h₁</text>
  </g>

  <text class="text" x="800" y="142" text-anchor="middle" font-size="18" font-weight="750" fill="#1d4ed8">Forward：边界激活从左向右流动</text>
  <text class="text" x="800" y="628" text-anchor="middle" font-size="18" font-weight="750" fill="#be185d">Backward：边界激活梯度从右向左流动</text>

  <!-- Local state summary. -->
  <g filter="url(#shadow)">
    <rect x="120" y="690" width="1360" height="160" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text class="text" x="160" y="735" font-size="21" font-weight="780">每个 Stage 长期持有</text>
  <g class="text" text-anchor="middle">
    <rect x="160" y="762" width="260" height="56" rx="28" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="460" y="762" width="260" height="56" rx="28" fill="#f0fdf4" stroke="#bbf7d0"/>
    <rect x="760" y="762" width="260" height="56" rx="28" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="1060" y="762" width="360" height="56" rx="28" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="290" y="797" font-size="17" font-weight="700">本 Stage 参数 θₖ</text>
    <text x="590" y="797" font-size="17" font-weight="700">本 Stage 参数梯度</text>
    <text x="890" y="797" font-size="17" font-weight="700">本 Stage 优化器状态</text>
    <text x="1240" y="797" font-size="17" font-weight="700">边界激活与必要的重计算状态</text>
  </g>
</svg>
