<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">朴素模型并行的单批次执行时间线</title>
  <desc id="desc">四个 GPU 顺序完成同一批次的前向，再反向顺序完成反向传播。每个计算时间片只有一张 GPU 工作，其余 GPU 空闲，最后进行同步优化器更新。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <style>
      .text { font-family: Inter, 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .muted { fill: #64748b; }
      .stage { font-size: 19px; font-weight: 760; text-anchor: end; }
      .tick { font-size: 15px; text-anchor: middle; fill: #64748b; }
      .cell { font-size: 19px; font-weight: 800; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>

  <text class="text" x="58" y="60" font-size="36" font-weight="800">朴素层间模型并行：一个批次的 Forward / Backward</text>
  <text class="text muted" x="58" y="101" font-size="19">K = 4 个 Stage，M = 1 个批次；下标 0 表示同一个批次</text>

  <g transform="translate(1115 42)">
    <rect width="180" height="46" rx="23" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="198" width="180" height="46" rx="23" fill="#fce7f3" stroke="#f9a8d4"/>
    <circle cx="24" cy="23" r="7" fill="#2563eb"/>
    <circle cx="222" cy="23" r="7" fill="#db2777"/>
    <text class="text" x="43" y="29" font-size="15" font-weight="700">F₀：前向</text>
    <text class="text" x="241" y="29" font-size="15" font-weight="700">B₀：反向</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="48" y="146" width="1504" height="500" rx="26" fill="#ffffff" stroke="#cbd5e1"/>
  </g>

  <g class="text tick">
    <text x="386" y="205">t0</text><text x="506" y="205">t1</text><text x="626" y="205">t2</text>
    <text x="746" y="205">t3</text><text x="866" y="205">t4</text><text x="986" y="205">t5</text>
    <text x="1106" y="205">t6</text><text x="1226" y="205">t7</text><text x="1381" y="205">Optimizer Step</text>
  </g>

  <g class="text stage">
    <text x="302" y="281">GPU 0 · Stage 0</text>
    <text x="302" y="371">GPU 1 · Stage 1</text>
    <text x="302" y="461">GPU 2 · Stage 2</text>
    <text x="302" y="551">GPU 3 · Stage 3</text>
  </g>

  <g fill="#f1f5f9" stroke="#e2e8f0">
    <rect x="326" y="236" width="1120" height="64" rx="10"/>
    <rect x="326" y="326" width="1120" height="64" rx="10"/>
    <rect x="326" y="416" width="1120" height="64" rx="10"/>
    <rect x="326" y="506" width="1120" height="64" rx="10"/>
  </g>
  <g stroke="#e2e8f0">
    <line x1="446" y1="226" x2="446" y2="580"/><line x1="566" y1="226" x2="566" y2="580"/>
    <line x1="686" y1="226" x2="686" y2="580"/><line x1="806" y1="226" x2="806" y2="580"/>
    <line x1="926" y1="226" x2="926" y2="580"/><line x1="1046" y1="226" x2="1046" y2="580"/>
    <line x1="1166" y1="226" x2="1166" y2="580"/><line x1="1286" y1="226" x2="1286" y2="580"/>
  </g>

  <g fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5">
    <rect x="332" y="242" width="108" height="52" rx="9"/>
    <rect x="452" y="332" width="108" height="52" rx="9"/>
    <rect x="572" y="422" width="108" height="52" rx="9"/>
    <rect x="692" y="512" width="108" height="52" rx="9"/>
  </g>
  <g fill="#fce7f3" stroke="#f472b6" stroke-width="1.5">
    <rect x="812" y="512" width="108" height="52" rx="9"/>
    <rect x="932" y="422" width="108" height="52" rx="9"/>
    <rect x="1052" y="332" width="108" height="52" rx="9"/>
    <rect x="1172" y="242" width="108" height="52" rx="9"/>
  </g>
  <g fill="#dcfce7" stroke="#4ade80" stroke-width="1.5">
    <rect x="1294" y="242" width="144" height="52" rx="9"/>
    <rect x="1294" y="332" width="144" height="52" rx="9"/>
    <rect x="1294" y="422" width="144" height="52" rx="9"/>
    <rect x="1294" y="512" width="144" height="52" rx="9"/>
  </g>
  <g class="text cell">
    <text x="386" y="276">F₀</text><text x="506" y="366">F₀</text><text x="626" y="456">F₀</text><text x="746" y="546">F₀</text>
    <text x="866" y="546">B₀</text><text x="986" y="456">B₀</text><text x="1106" y="366">B₀</text><text x="1226" y="276">B₀</text>
  </g>
  <g class="text" font-size="14" font-weight="700" text-anchor="middle">
    <text x="1366" y="275">更新 θ₀</text><text x="1366" y="365">更新 θ₁</text>
    <text x="1366" y="455">更新 θ₂</text><text x="1366" y="545">更新 θ₃</text>
  </g>

  <g transform="translate(75 700)">
    <circle cx="28" cy="28" r="28" fill="#dbeafe"/><text class="text" x="28" y="36" text-anchor="middle" font-size="20" font-weight="800">1</text>
    <text class="text" x="72" y="22" font-size="18" font-weight="760">Forward：激活从 GPU 0 依次传到 GPU 3</text>
    <text class="text muted" x="72" y="53" font-size="16">后一个 Stage 必须等待前一个 Stage 的输出</text>

    <circle cx="570" cy="28" r="28" fill="#fce7f3"/><text class="text" x="570" y="36" text-anchor="middle" font-size="20" font-weight="800">2</text>
    <text class="text" x="614" y="22" font-size="18" font-weight="760">Backward：激活梯度沿相反方向传回</text>
    <text class="text muted" x="614" y="53" font-size="16">各 Stage 计算自己持有参数的梯度</text>

    <circle cx="1120" cy="28" r="28" fill="#dcfce7"/><text class="text" x="1120" y="36" text-anchor="middle" font-size="20" font-weight="800">3</text>
    <text class="text" x="1164" y="22" font-size="18" font-weight="760">Update：优化器更新本地参数</text>
    <text class="text muted" x="1164" y="53" font-size="16">下一批开始前完成同一训练步</text>
  </g>
</svg>
