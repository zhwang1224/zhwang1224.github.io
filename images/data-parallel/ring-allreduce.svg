<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ring AllReduce 两阶段执行过程</title>
  <desc id="desc">四个 Rank 构成单向逻辑环。每个 Rank 的完整梯度被切分成四块。经过三轮 ReduceScatter，每个 Rank 保留一个完成求和规约的数据块；再经过三轮 AllGather，每个 Rank 都获得相同的完整规约结果。</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .text { font-family: Inter, 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .symbol { font-family: 'Cambria Math', 'STIX Two Math', 'Segoe UI Symbol', serif; fill: #0f172a; }
      .muted { fill: #64748b; }
      .panel-title { font-size: 23px; font-weight: 750; }
      .small { font-size: 15px; }
      .rank { font-size: 16px; font-weight: 700; }
      .chunk { font-size: 17px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>

  <text class="text" x="50" y="56" font-size="35" font-weight="800">Ring AllReduce：ReduceScatter + AllGather</text>
  <text class="text muted" x="50" y="94" font-size="19">示例：P = 4，每个 Rank 将大小为 M 的梯度缓冲区等分为 A、B、C、D 四个数据块</text>
  <g transform="translate(1260 42)">
    <rect width="290" height="52" rx="26" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="26" cy="26" r="7" fill="#2563eb"/>
    <text class="text" x="46" y="32" font-size="16" font-weight="650">单向逻辑环 · 同步流水传输</text>
  </g>

  <!-- Ring topology. -->
  <g filter="url(#shadow)">
    <rect x="50" y="126" width="1500" height="258" rx="22" fill="#ffffff" stroke="#dbe3ee"/>
  </g>
  <text class="text panel-title" x="82" y="169">1. 逻辑环</text>
  <text class="text muted" x="205" y="168" font-size="16">每轮中，每个 Rank 同时向 next Rank 发送一个数据块，并从 prev Rank 接收一个数据块</text>

  <rect x="485" y="192" width="132" height="56" rx="28" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="983" y="192" width="132" height="56" rx="28" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="983" y="306" width="132" height="56" rx="28" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="485" y="306" width="132" height="56" rx="28" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="text" x="551" y="227" text-anchor="middle" font-size="19" font-weight="750">Rank 0</text>
  <text class="text" x="1049" y="227" text-anchor="middle" font-size="19" font-weight="750">Rank 1</text>
  <text class="text" x="1049" y="341" text-anchor="middle" font-size="19" font-weight="750">Rank 2</text>
  <text class="text" x="551" y="341" text-anchor="middle" font-size="19" font-weight="750">Rank 3</text>

  <line x1="617" y1="220" x2="975" y2="220" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
  <line x1="1049" y1="248" x2="1049" y2="298" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
  <line x1="983" y1="334" x2="625" y2="334" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
  <line x1="551" y1="306" x2="551" y2="256" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrow-blue)"/>

  <text class="text" x="800" y="264" text-anchor="middle" font-size="18" font-weight="700">0 → 1 → 2 → 3 → 0</text>
  <text class="text muted" x="800" y="291" text-anchor="middle" font-size="15">只与相邻 Rank 通信；不同数据块可形成流水</text>

  <!-- Three semantic states. -->
  <g filter="url(#shadow)">
    <rect x="40" y="420" width="430" height="390" rx="22" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="585" y="420" width="430" height="390" rx="22" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="1130" y="420" width="430" height="390" rx="22" fill="#ffffff" stroke="#dbe3ee"/>
  </g>

  <text class="text panel-title" x="255" y="460" text-anchor="middle">初始状态</text>
  <text class="text muted" x="255" y="486" text-anchor="middle" font-size="15">每个 Rank 都有完整的局部梯度</text>

  <text class="text panel-title" x="800" y="460" text-anchor="middle">ReduceScatter 完成</text>
  <text class="text muted" x="800" y="486" text-anchor="middle" font-size="15">每个 Rank 保留一个已规约数据块</text>

  <text class="text panel-title" x="1345" y="460" text-anchor="middle">AllGather 完成</text>
  <text class="text muted" x="1345" y="486" text-anchor="middle" font-size="15">每个 Rank 获得相同的完整规约结果</text>

  <!-- Initial rank buffers. -->
  <text class="text rank" x="72" y="543">Rank 0</text>
  <text class="text rank" x="72" y="611">Rank 1</text>
  <text class="text rank" x="72" y="679">Rank 2</text>
  <text class="text rank" x="72" y="747">Rank 3</text>

  <g>
    <rect x="140" y="514" width="72" height="44" rx="8" fill="#bfdbfe" stroke="#60a5fa"/><rect x="216" y="514" width="72" height="44" rx="8" fill="#a7f3d0" stroke="#34d399"/><rect x="292" y="514" width="72" height="44" rx="8" fill="#fde0a7" stroke="#f59e0b"/><rect x="368" y="514" width="72" height="44" rx="8" fill="#fbcfe8" stroke="#f472b6"/>
    <rect x="140" y="582" width="72" height="44" rx="8" fill="#bfdbfe" stroke="#60a5fa"/><rect x="216" y="582" width="72" height="44" rx="8" fill="#a7f3d0" stroke="#34d399"/><rect x="292" y="582" width="72" height="44" rx="8" fill="#fde0a7" stroke="#f59e0b"/><rect x="368" y="582" width="72" height="44" rx="8" fill="#fbcfe8" stroke="#f472b6"/>
    <rect x="140" y="650" width="72" height="44" rx="8" fill="#bfdbfe" stroke="#60a5fa"/><rect x="216" y="650" width="72" height="44" rx="8" fill="#a7f3d0" stroke="#34d399"/><rect x="292" y="650" width="72" height="44" rx="8" fill="#fde0a7" stroke="#f59e0b"/><rect x="368" y="650" width="72" height="44" rx="8" fill="#fbcfe8" stroke="#f472b6"/>
    <rect x="140" y="718" width="72" height="44" rx="8" fill="#bfdbfe" stroke="#60a5fa"/><rect x="216" y="718" width="72" height="44" rx="8" fill="#a7f3d0" stroke="#34d399"/><rect x="292" y="718" width="72" height="44" rx="8" fill="#fde0a7" stroke="#f59e0b"/><rect x="368" y="718" width="72" height="44" rx="8" fill="#fbcfe8" stroke="#f472b6"/>
  </g>
  <g class="symbol chunk" text-anchor="middle">
    <text x="176" y="542">A₀</text><text x="252" y="542">B₀</text><text x="328" y="542">C₀</text><text x="404" y="542">D₀</text>
    <text x="176" y="610">A₁</text><text x="252" y="610">B₁</text><text x="328" y="610">C₁</text><text x="404" y="610">D₁</text>
    <text x="176" y="678">A₂</text><text x="252" y="678">B₂</text><text x="328" y="678">C₂</text><text x="404" y="678">D₂</text>
    <text x="176" y="746">A₃</text><text x="252" y="746">B₃</text><text x="328" y="746">C₃</text><text x="404" y="746">D₃</text>
  </g>

  <!-- ReduceScatter result. -->
  <text class="text rank" x="615" y="543">Rank 0</text>
  <text class="text rank" x="615" y="611">Rank 1</text>
  <text class="text rank" x="615" y="679">Rank 2</text>
  <text class="text rank" x="615" y="747">Rank 3</text>
  <rect x="688" y="514" width="290" height="44" rx="8" fill="#bfdbfe" stroke="#60a5fa"/>
  <rect x="688" y="582" width="290" height="44" rx="8" fill="#a7f3d0" stroke="#34d399"/>
  <rect x="688" y="650" width="290" height="44" rx="8" fill="#fde0a7" stroke="#f59e0b"/>
  <rect x="688" y="718" width="290" height="44" rx="8" fill="#fbcfe8" stroke="#f472b6"/>
  <g class="symbol chunk" text-anchor="middle">
    <text x="833" y="542">A = Σᵣ Aᵣ</text>
    <text x="833" y="610">B = Σᵣ Bᵣ</text>
    <text x="833" y="678">C = Σᵣ Cᵣ</text>
    <text x="833" y="746">D = Σᵣ Dᵣ</text>
  </g>

  <!-- AllGather result. -->
  <text class="text rank" x="1158" y="543">Rank 0</text>
  <text class="text rank" x="1158" y="611">Rank 1</text>
  <text class="text rank" x="1158" y="679">Rank 2</text>
  <text class="text rank" x="1158" y="747">Rank 3</text>
  <g>
    <rect x="1225" y="514" width="72" height="44" rx="8" fill="#bfdbfe" stroke="#60a5fa"/><rect x="1301" y="514" width="72" height="44" rx="8" fill="#a7f3d0" stroke="#34d399"/><rect x="1377" y="514" width="72" height="44" rx="8" fill="#fde0a7" stroke="#f59e0b"/><rect x="1453" y="514" width="72" height="44" rx="8" fill="#fbcfe8" stroke="#f472b6"/>
    <rect x="1225" y="582" width="72" height="44" rx="8" fill="#bfdbfe" stroke="#60a5fa"/><rect x="1301" y="582" width="72" height="44" rx="8" fill="#a7f3d0" stroke="#34d399"/><rect x="1377" y="582" width="72" height="44" rx="8" fill="#fde0a7" stroke="#f59e0b"/><rect x="1453" y="582" width="72" height="44" rx="8" fill="#fbcfe8" stroke="#f472b6"/>
    <rect x="1225" y="650" width="72" height="44" rx="8" fill="#bfdbfe" stroke="#60a5fa"/><rect x="1301" y="650" width="72" height="44" rx="8" fill="#a7f3d0" stroke="#34d399"/><rect x="1377" y="650" width="72" height="44" rx="8" fill="#fde0a7" stroke="#f59e0b"/><rect x="1453" y="650" width="72" height="44" rx="8" fill="#fbcfe8" stroke="#f472b6"/>
    <rect x="1225" y="718" width="72" height="44" rx="8" fill="#bfdbfe" stroke="#60a5fa"/><rect x="1301" y="718" width="72" height="44" rx="8" fill="#a7f3d0" stroke="#34d399"/><rect x="1377" y="718" width="72" height="44" rx="8" fill="#fde0a7" stroke="#f59e0b"/><rect x="1453" y="718" width="72" height="44" rx="8" fill="#fbcfe8" stroke="#f472b6"/>
  </g>
  <g class="symbol chunk" text-anchor="middle">
    <text x="1261" y="542">A</text><text x="1337" y="542">B</text><text x="1413" y="542">C</text><text x="1489" y="542">D</text>
    <text x="1261" y="610">A</text><text x="1337" y="610">B</text><text x="1413" y="610">C</text><text x="1489" y="610">D</text>
    <text x="1261" y="678">A</text><text x="1337" y="678">B</text><text x="1413" y="678">C</text><text x="1489" y="678">D</text>
    <text x="1261" y="746">A</text><text x="1337" y="746">B</text><text x="1413" y="746">C</text><text x="1489" y="746">D</text>
  </g>

  <!-- Phase arrows. -->
  <text class="text" x="527" y="577" text-anchor="middle" font-size="17" font-weight="750" fill="#6d28d9">ReduceScatter</text>
  <text class="text muted" x="527" y="601" text-anchor="middle" font-size="14">P − 1 = 3 轮</text>
  <line x1="482" y1="628" x2="572" y2="628" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-purple)"/>

  <text class="text" x="1072" y="577" text-anchor="middle" font-size="17" font-weight="750" fill="#6d28d9">AllGather</text>
  <text class="text muted" x="1072" y="601" text-anchor="middle" font-size="14">P − 1 = 3 轮</text>
  <line x1="1027" y1="628" x2="1117" y2="628" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-purple)"/>

  <!-- Communication-volume summary. -->
  <g filter="url(#shadow)">
    <rect x="180" y="850" width="1240" height="100" rx="20" fill="#ffffff" stroke="#c4b5fd"/>
  </g>
  <text class="text" x="800" y="883" text-anchor="middle" font-size="18" font-weight="750">每个 Rank 的单向发送量</text>
  <text class="symbol" x="505" y="922" text-anchor="middle" font-size="22">ReduceScatter：((P − 1) / P) M</text>
  <text class="symbol" x="1095" y="922" text-anchor="middle" font-size="22">AllGather：((P − 1) / P) M</text>
  <line x1="800" y1="894" x2="800" y2="932" stroke="#e2e8f0" stroke-width="2"/>
  <text class="text muted" x="800" y="978" text-anchor="middle" font-size="15">合计 2(P − 1)M / P；接收量相同。图中示意性地令 Rank r 保留第 r 个规约块，具体归属可随实现调度变化。</text>
</svg>
