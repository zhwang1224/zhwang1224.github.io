<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">同步数据并行训练示意图</title>
  <desc id="desc">全局批次被切分给四个 Rank。每个 Rank 保存相同的完整模型副本，使用不同数据分片执行前向和反向计算得到局部梯度。局部梯度经过 AllReduce 求平均后返回所有 Rank，各 Rank 使用相同梯度独立执行相同的优化器更新。</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-pink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#db2777"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .text { font-family: Inter, 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .symbol { font-family: 'Cambria Math', 'STIX Two Math', 'Segoe UI Symbol', serif; fill: #0f172a; }
      .muted { fill: #64748b; }
      .rank { font-size: 23px; font-weight: 750; }
      .box-title { font-size: 20px; font-weight: 700; }
      .small { font-size: 16px; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f8fafc"/>

  <text class="text" x="60" y="58" font-size="36" font-weight="800">数据并行（Distributed Data Parallel）</text>
  <text class="text muted" x="60" y="96" font-size="19">相同的完整模型副本处理不同数据分片，AllReduce 同步梯度后，各 Rank 独立执行相同的参数更新</text>

  <g transform="translate(1262 42)">
    <rect width="278" height="54" rx="27" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="27" cy="27" r="7" fill="#2563eb"/>
    <text class="text" x="47" y="33" font-size="16" font-weight="650">同步数据并行 · 逻辑语义</text>
  </g>

  <!-- Global mini-batch and data partitioning. -->
  <g filter="url(#shadow)">
    <rect x="620" y="128" width="360" height="78" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <text class="text" x="800" y="160" text-anchor="middle" font-size="18" font-weight="650">全局批次</text>
  <text class="symbol" x="800" y="190" text-anchor="middle" font-size="25" font-weight="700">B</text>
  <text class="text muted" x="800" y="236" text-anchor="middle" font-size="16">按 Rank 切分，示例中 P = 4</text>

  <line x1="800" y1="206" x2="800" y2="250" stroke="#2563eb" stroke-width="3"/>
  <line x1="150" y1="250" x2="1290" y2="250" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="250" x2="150" y2="377" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="530" y1="250" x2="530" y2="377" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="910" y1="250" x2="910" y2="377" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="1290" y1="250" x2="1290" y2="377" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- Rank 0. -->
  <g filter="url(#shadow)">
    <rect x="60" y="286" width="340" height="424" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="60" y="286" width="340" height="58" rx="22" fill="#eff6ff"/>
  <path d="M60 322 H400 V344 H60 Z" fill="#eff6ff"/>
  <text class="text rank" x="230" y="323" text-anchor="middle">Rank 0 · GPU 0</text>
  <rect x="88" y="382" width="124" height="66" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="text small" x="150" y="407" text-anchor="middle" font-weight="650">局部批次</text>
  <text class="symbol" x="150" y="435" text-anchor="middle" font-size="22" font-weight="700">B₀</text>
  <rect x="228" y="382" width="144" height="66" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.5"/>
  <text class="text small" x="300" y="407" text-anchor="middle" font-weight="650">完整模型副本</text>
  <text class="symbol" x="300" y="435" text-anchor="middle" font-size="22" font-weight="700">θₜ</text>
  <line x1="150" y1="448" x2="184" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <line x1="300" y1="448" x2="276" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <rect x="112" y="494" width="236" height="72" rx="36" fill="#ecfccb" stroke="#84cc16" stroke-width="1.5"/>
  <text class="text box-title" x="230" y="526" text-anchor="middle">Forward / Backward</text>
  <text class="text muted" x="230" y="550" text-anchor="middle" font-size="14">本地计算，无跨 Rank 数据交换</text>
  <line x1="230" y1="566" x2="230" y2="606" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <rect x="112" y="610" width="236" height="68" rx="14" fill="#fce7f3" stroke="#f472b6" stroke-width="1.5"/>
  <text class="text small" x="230" y="635" text-anchor="middle" font-weight="650">局部梯度</text>
  <text class="symbol" x="230" y="663" text-anchor="middle" font-size="22" font-weight="700">g₀</text>

  <!-- Rank 1. -->
  <g filter="url(#shadow)">
    <rect x="440" y="286" width="340" height="424" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="440" y="286" width="340" height="58" rx="22" fill="#eff6ff"/>
  <path d="M440 322 H780 V344 H440 Z" fill="#eff6ff"/>
  <text class="text rank" x="610" y="323" text-anchor="middle">Rank 1 · GPU 1</text>
  <rect x="468" y="382" width="124" height="66" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="text small" x="530" y="407" text-anchor="middle" font-weight="650">局部批次</text>
  <text class="symbol" x="530" y="435" text-anchor="middle" font-size="22" font-weight="700">B₁</text>
  <rect x="608" y="382" width="144" height="66" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.5"/>
  <text class="text small" x="680" y="407" text-anchor="middle" font-weight="650">完整模型副本</text>
  <text class="symbol" x="680" y="435" text-anchor="middle" font-size="22" font-weight="700">θₜ</text>
  <line x1="530" y1="448" x2="564" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <line x1="680" y1="448" x2="656" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <rect x="492" y="494" width="236" height="72" rx="36" fill="#ecfccb" stroke="#84cc16" stroke-width="1.5"/>
  <text class="text box-title" x="610" y="526" text-anchor="middle">Forward / Backward</text>
  <text class="text muted" x="610" y="550" text-anchor="middle" font-size="14">本地计算，无跨 Rank 数据交换</text>
  <line x1="610" y1="566" x2="610" y2="606" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <rect x="492" y="610" width="236" height="68" rx="14" fill="#fce7f3" stroke="#f472b6" stroke-width="1.5"/>
  <text class="text small" x="610" y="635" text-anchor="middle" font-weight="650">局部梯度</text>
  <text class="symbol" x="610" y="663" text-anchor="middle" font-size="22" font-weight="700">g₁</text>

  <!-- Rank 2. -->
  <g filter="url(#shadow)">
    <rect x="820" y="286" width="340" height="424" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="820" y="286" width="340" height="58" rx="22" fill="#eff6ff"/>
  <path d="M820 322 H1160 V344 H820 Z" fill="#eff6ff"/>
  <text class="text rank" x="990" y="323" text-anchor="middle">Rank 2 · GPU 2</text>
  <rect x="848" y="382" width="124" height="66" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="text small" x="910" y="407" text-anchor="middle" font-weight="650">局部批次</text>
  <text class="symbol" x="910" y="435" text-anchor="middle" font-size="22" font-weight="700">B₂</text>
  <rect x="988" y="382" width="144" height="66" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.5"/>
  <text class="text small" x="1060" y="407" text-anchor="middle" font-weight="650">完整模型副本</text>
  <text class="symbol" x="1060" y="435" text-anchor="middle" font-size="22" font-weight="700">θₜ</text>
  <line x1="910" y1="448" x2="944" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <line x1="1060" y1="448" x2="1036" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <rect x="872" y="494" width="236" height="72" rx="36" fill="#ecfccb" stroke="#84cc16" stroke-width="1.5"/>
  <text class="text box-title" x="990" y="526" text-anchor="middle">Forward / Backward</text>
  <text class="text muted" x="990" y="550" text-anchor="middle" font-size="14">本地计算，无跨 Rank 数据交换</text>
  <line x1="990" y1="566" x2="990" y2="606" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <rect x="872" y="610" width="236" height="68" rx="14" fill="#fce7f3" stroke="#f472b6" stroke-width="1.5"/>
  <text class="text small" x="990" y="635" text-anchor="middle" font-weight="650">局部梯度</text>
  <text class="symbol" x="990" y="663" text-anchor="middle" font-size="22" font-weight="700">g₂</text>

  <!-- Rank 3. -->
  <g filter="url(#shadow)">
    <rect x="1200" y="286" width="340" height="424" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="1200" y="286" width="340" height="58" rx="22" fill="#eff6ff"/>
  <path d="M1200 322 H1540 V344 H1200 Z" fill="#eff6ff"/>
  <text class="text rank" x="1370" y="323" text-anchor="middle">Rank 3 · GPU 3</text>
  <rect x="1228" y="382" width="124" height="66" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="text small" x="1290" y="407" text-anchor="middle" font-weight="650">局部批次</text>
  <text class="symbol" x="1290" y="435" text-anchor="middle" font-size="22" font-weight="700">B₃</text>
  <rect x="1368" y="382" width="144" height="66" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.5"/>
  <text class="text small" x="1440" y="407" text-anchor="middle" font-weight="650">完整模型副本</text>
  <text class="symbol" x="1440" y="435" text-anchor="middle" font-size="22" font-weight="700">θₜ</text>
  <line x1="1290" y1="448" x2="1324" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <line x1="1440" y1="448" x2="1416" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <rect x="1252" y="494" width="236" height="72" rx="36" fill="#ecfccb" stroke="#84cc16" stroke-width="1.5"/>
  <text class="text box-title" x="1370" y="526" text-anchor="middle">Forward / Backward</text>
  <text class="text muted" x="1370" y="550" text-anchor="middle" font-size="14">本地计算，无跨 Rank 数据交换</text>
  <line x1="1370" y1="566" x2="1370" y2="606" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <rect x="1252" y="610" width="236" height="68" rx="14" fill="#fce7f3" stroke="#f472b6" stroke-width="1.5"/>
  <text class="text small" x="1370" y="635" text-anchor="middle" font-weight="650">局部梯度</text>
  <text class="symbol" x="1370" y="663" text-anchor="middle" font-size="22" font-weight="700">g₃</text>

  <!-- Local gradients enter the collective operation. -->
  <text class="text" x="800" y="738" text-anchor="middle" font-size="16" font-weight="650" fill="#be185d">所有 Rank 共同参与梯度规约</text>
  <line x1="230" y1="678" x2="500" y2="773" stroke="#db2777" stroke-width="3" marker-end="url(#arrow-pink)"/>
  <line x1="610" y1="678" x2="700" y2="773" stroke="#db2777" stroke-width="3" marker-end="url(#arrow-pink)"/>
  <line x1="990" y1="678" x2="900" y2="773" stroke="#db2777" stroke-width="3" marker-end="url(#arrow-pink)"/>
  <line x1="1370" y1="678" x2="1100" y2="773" stroke="#db2777" stroke-width="3" marker-end="url(#arrow-pink)"/>

  <!-- AllReduce is drawn centrally only as a logical collective, not as a server. -->
  <g filter="url(#shadow)">
    <rect x="420" y="778" width="760" height="126" rx="24" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text class="text" x="800" y="816" text-anchor="middle" font-size="25" font-weight="800" fill="#6d28d9">AllReduce（SUM ÷ P）</text>
  <text class="symbol" x="800" y="852" text-anchor="middle" font-size="25" font-weight="700">g = (1 / P) Σᵣ gᵣ</text>
  <text class="text muted" x="800" y="883" text-anchor="middle" font-size="15">无 Root 的集合操作：中心框仅表示逻辑语义，不代表中心参数服务器</text>

  <!-- The same reduced gradient is returned to all ranks. -->
  <line x1="800" y1="904" x2="800" y2="932" stroke="#7c3aed" stroke-width="3"/>
  <line x1="230" y1="932" x2="1370" y2="932" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="230" y1="932" x2="230" y2="970" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <line x1="610" y1="932" x2="610" y2="970" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <line x1="990" y1="932" x2="990" y2="970" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <line x1="1370" y1="932" x2="1370" y2="970" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <g filter="url(#shadow)">
    <rect x="60" y="975" width="340" height="96" rx="18" fill="#ffffff" stroke="#c4b5fd"/>
    <rect x="440" y="975" width="340" height="96" rx="18" fill="#ffffff" stroke="#c4b5fd"/>
    <rect x="820" y="975" width="340" height="96" rx="18" fill="#ffffff" stroke="#c4b5fd"/>
    <rect x="1200" y="975" width="340" height="96" rx="18" fill="#ffffff" stroke="#c4b5fd"/>
  </g>
  <text class="text" x="230" y="1011" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">同步梯度 g</text>
  <text class="symbol" x="230" y="1045" text-anchor="middle" font-size="19">Optimizer.step → θₜ₊₁</text>
  <text class="text" x="610" y="1011" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">同步梯度 g</text>
  <text class="symbol" x="610" y="1045" text-anchor="middle" font-size="19">Optimizer.step → θₜ₊₁</text>
  <text class="text" x="990" y="1011" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">同步梯度 g</text>
  <text class="symbol" x="990" y="1045" text-anchor="middle" font-size="19">Optimizer.step → θₜ₊₁</text>
  <text class="text" x="1370" y="1011" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">同步梯度 g</text>
  <text class="symbol" x="1370" y="1045" text-anchor="middle" font-size="19">Optimizer.step → θₜ₊₁</text>

  <text class="text muted" x="800" y="1104" text-anchor="middle" font-size="15">若初始参数和优化器状态一致，各 Rank 在本轮更新后仍具有相同参数 θₜ₊₁</text>
</svg>
